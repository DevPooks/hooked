name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hooked
          POSTGRES_PASSWORD: hooked
          POSTGRES_DB: hooked
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooked -d hooked"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://hooked:hooked@localhost:5432/hooked
      REDIS_URL: redis://localhost:6379
      RUN_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t hooked:ci .
      - run: docker compose config --quiet
